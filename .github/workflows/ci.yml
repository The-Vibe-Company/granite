name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run lint
      - name: Run tests with coverage
        run: npm run test:coverage

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Railway Dockerfile compatibility
        run: |
          if grep -Ein '^[[:space:]]*VOLUME([[:space:]]|$)' Dockerfile; then
            echo 'Railway rejects Dockerfile VOLUME instructions. Attach storage in Railway instead.' >&2
            exit 1
          fi
      - name: Build Railway container
        run: docker build --tag granite-ci .

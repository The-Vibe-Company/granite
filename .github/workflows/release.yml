name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check npm version availability
        id: package
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing ${name}@${version}"
          fi

      - name: Publish to npm (trusted publishing)
        id: publish_oidc
        if: steps.package.outputs.publish == 'true' && env.NPM_TOKEN == ''
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-}"
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          echo "attempting OIDC trusted publishing as $(npm --version)"
          npm publish --provenance

      - name: Publish to npm (token fallback)
        # Trusted publishing is the intended path, but the OIDC exchange currently
        # fails with ENEEDAUTH before any token is presented. Rather than block
        # releases on that, fall back to a token when one is configured.
        if: >-
          steps.package.outputs.publish == 'true' &&
          (env.NPM_TOKEN != '' || steps.publish_oidc.outcome == 'failure')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-}"
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::OIDC trusted publishing failed and no NPM_TOKEN secret is set."
            echo "Add an npm automation token as the NPM_TOKEN repository secret, or fix"
            echo "the trusted publisher configuration on npmjs.com."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "$HOME/.npmrc"
          npm publish --provenance

  publish-current:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check npm version availability
        id: package
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing ${name}@${version}"
          fi

      - name: Publish to npm (trusted publishing)
        id: publish_oidc
        if: steps.package.outputs.publish == 'true' && env.NPM_TOKEN == ''
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-}"
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          echo "attempting OIDC trusted publishing as $(npm --version)"
          npm publish --provenance

      - name: Publish to npm (token fallback)
        # Trusted publishing is the intended path, but the OIDC exchange currently
        # fails with ENEEDAUTH before any token is presented. Rather than block
        # releases on that, fall back to a token when one is configured.
        if: >-
          steps.package.outputs.publish == 'true' &&
          (env.NPM_TOKEN != '' || steps.publish_oidc.outcome == 'failure')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-}"
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::OIDC trusted publishing failed and no NPM_TOKEN secret is set."
            echo "Add an npm automation token as the NPM_TOKEN repository secret, or fix"
            echo "the trusted publisher configuration on npmjs.com."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "$HOME/.npmrc"
          npm publish --provenance
